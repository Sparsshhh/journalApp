# Runs the app with its own MongoDB:  docker compose up --build
# Copy .env.example to .env and fill in the secrets first.
services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/journaldb
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JOURNAL_ENCRYPTION_KEY: ${JOURNAL_ENCRYPTION_KEY:?set JOURNAL_ENCRYPTION_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

volumes:
  mongo-data:
