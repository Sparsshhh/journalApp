# Test-only settings, loaded in addition to src/main/resources/application.properties.
# The tests start their own MongoDB of this version, so they need no database or Docker.
de.flapdoodle.mongodb.embedded.version=8.0.9
jwt.secret=test-secret-that-is-at-least-32-characters-long
journal.encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
# The tests hammer the login and sign-up endpoints; the limiter has its own unit test.
ratelimit.auth.max-requests=100000
