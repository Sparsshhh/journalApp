# Settings the code relies on in every environment. Anything secret or environment-specific
# (database address, JWT secret, encryption key, first admin) comes from environment
# variables: see README.md and application-example.properties.
spring.application.name=journalApp

# Creates the unique username index and the refresh-token expiry index at startup.
spring.data.mongodb.auto-index-creation=true

# Only the health endpoint is exposed, at /actuator/health.
management.endpoints.web.exposure.include=health
